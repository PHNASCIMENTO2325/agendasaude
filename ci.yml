name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda123
          POSTGRES_DB: agendasaude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://agenda:agenda123@localhost:5432/agendasaude_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
